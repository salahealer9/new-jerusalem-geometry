<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" data-upstream-audit-phase="10E" data-provenance-class="PROJECT_RECONSTRUCTION" data-free-parameters="0">
<title>The Spindle of Necessity — Plato's Eight Whorls</title>
<desc>Deterministic reconstruction from Plato's ordinal ranking and Michell's musical-number interpretation. Eight concentric whorls and a central shaft show the cumulative radial construction, with the first two New Jerusalem correspondences and the outer boundary highlighted. The provenance boundary distinguishes Plato's ordinal information, Michell's numerical interpretation, and the project's arithmetic reconstruction.</desc>
