<text class="subtitle" x="900" y="105">Native anchor and the single cubic-capable operation</text>
<line class="anchor" x1="1000.000000" y1="555.000000" x2="1062.000000" y2="555.000000" />
<line class="anchor" x1="1062.000000" y1="555.000000" x2="1062.000000" y2="232.838550" />
<line class="anchor" x1="1000.000000" y1="555.000000" x2="1062.000000" y2="232.838550" />
<text class="label" x="1031.000000" y="577.000000">u = 7 - 2×3 = 1</text>
<text class="label" x="1072.000000" y="393.919275">v = 3√3</text>
<text class="label" x="936.000000" y="385.919275">H = 2√7</text>
<line class="ray" x1="1000.000000" y1="555.000000" x2="1138.872749" y2="486.156993" />
<text class="small" x="1143.872749" y="486.156993">φ</text>
<line class="ray" x1="1000.000000" y1="555.000000" x2="1093.846973" y2="431.639773" />
<text class="small" x="1098.846973" y="431.639773">2φ</text>
<line class="anchor" x1="1000.000000" y1="555.000000" x2="1029.292247" y2="402.793022" />
<text class="small" x="1034.292247" y="402.793022">Θ=3φ</text>
<text class="label" x="900" y="615">Exactly one operation: TRISECT_ANGLE(Θ) → φ</text>
<text class="label" x="900" y="640">z = (2√7/3) cos φ;   y = z − 1/3</text>
<text class="label" x="900" y="663">y³ + y² − 2y − 1 = 0</text>
<text class="label" x="900" y="686">unique root 1&lt;y&lt;2 → y = 2 cos(2π/7)</text>
<text class="small" x="900" y="725">Method-1 angular RMS vs exact: 0.084260°</text>
<text class="small" x="900" y="744">Figure 14 plate angular RMS vs exact: 0.224059°</text>
<text class="small" x="900" y="763">Source consistency only; no refit and not independent validation.</text>
