<title id="title">Michell Figure 194 Method 2: 7 to 21 to 42</title>
<desc id="desc">Transparent three-panel deterministic rendering of the frozen Method 2 construction. The first panel shows the local seven-mark completion, the second the original-triangle twenty-one marks, and the third the original plus reciprocal forty-two marks.</desc>
